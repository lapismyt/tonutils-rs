[package]
name = "tonutils-mempool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Low-latency Rust stream for TON pending external messages."
readme = "../../README.md"
documentation = "https://docs.rs/tonutils-mempool"
keywords = ["ton", "mempool", "overlay", "blockchain"]
categories = ["network-programming", "cryptography::cryptocurrencies"]

[lints]
workspace = true

[dependencies]
tonutils-adnl = { path = "../tonutils-adnl", version = "2.0.0", features = ["udp", "quic"] }
futures.workspace = true
hex.workspace = true
raptorq.workspace = true
log.workspace = true
reqwest.workspace = true
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonutils-overlay = { path = "../tonutils-overlay", version = "2.0.0" }
tonutils-network-config = { path = "../tonutils-network-config", version = "2.0.0" }
tonutils-tlb = { path = "../tonutils-tlb", version = "2.0.0" }
tonutils-tl = { path = "../tonutils-tl", version = "2.0.0" }
tl-proto.workspace = true
tonutils-tvm = { path = "../tonutils-tvm", version = "2.0.0" }
quinn.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
pretty_env_logger.workspace = true
tonutils-wallet = { path = "../tonutils-wallet", version = "2.0.0" }

# Examples
[[example]]
name = "mempool_stream"
path = "../../examples/mempool/mempool_stream.rs"

[[example]]
name = "mempool_scan"
path = "../../examples/mempool/mempool_scan.rs"

[[example]]
name = "mempool_scan_fast"
path = "../../examples/mempool/mempool_scan_fast.rs"

[[example]]
name = "mempool_send_v5r1"
path = "../../examples/mempool/mempool_send_v5r1.rs"

[[example]]
name = "adnl_udp_mempool"
path = "../../examples/mempool/adnl_udp_mempool.rs"

[[example]]
name = "dht_diag"
path = "../../examples/mempool/dht_diag.rs"

[[example]]
name = "peer_store_scan"
path = "../../examples/mempool/peer_store_scan.rs"
