[package]
name = "tonutils-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tooling for TONUtils Rust crates."
readme = "../../README.md"
documentation = "https://docs.rs/tonutils-cli"
keywords = ["ton", "cli", "blockchain", "liteclient", "tvm"]
categories = ["command-line-utilities", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[[bin]]
name = "tonutils"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
num-bigint.workspace = true
pretty_env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonutils-contracts = { path = "../tonutils-contracts", version = "2.0.0" }
tonutils-liteclient = { path = "../tonutils-liteclient", version = "2.0.0" }
tonutils-network-config = { path = "../tonutils-network-config", version = "2.0.0" }
tonutils-tl = { path = "../tonutils-tl", version = "2.0.0" }
tonutils-tlb = { path = "../tonutils-tlb", version = "2.0.0" }
tonutils-tvm = { path = "../tonutils-tvm", version = "2.0.0" }
tonutils-wallet = { path = "../tonutils-wallet", version = "2.0.0", features = ["provider"] }
ureq.workspace = true
