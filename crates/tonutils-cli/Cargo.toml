[package]
name = "tonutils-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tooling for `tonutils` Rust crate."
readme = "../../README.md"
documentation = "https://lapismyt.github.io/tonutils-rs"
keywords = ["ton", "cli", "blockchain", "liteclient", "tvm"]
categories = ["command-line-utilities", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[[bin]]
name = "tonutils"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
num-bigint.workspace = true
pretty_env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonutils = { workspace = true, features = ["tvm", "tlb", "liteclient"] }
ureq.workspace = true
