[workspace]
resolver = "3"
members = [
    "crates/tonutils-cli",
    "crates/tonutils-macros",
    "crates/tonutils-schema-gen",
    "crates/tonutils",
]
default-members = [
    "crates/tonutils",
    "crates/tonutils-cli"
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lapismyt/tonutils-rs"
rust-version = "1.85"

[workspace.dependencies]
aes = "0.9"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
bip39 = { version = "2.1", features = ["rand"] }
clap = { version = "4.5", features = ["derive"] }
crc = "3.3"
ctr = "0.9"
curve25519-dalek = "5.0"
derivative = "2.2"
ed25519-dalek = "3.0"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
log = "0.4"
num-bigint = "0.5"
pbkdf2 = "0.12"
pin-project = "1.1"
pretty_env_logger = "0.5"
proc-macro2 = "1.0"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
quote = "1.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.21", features = ["base64"] }
sha2 = "0.10"
subtle = "2.6"
syn = { version = "3.0", features = ["full"] }
thiserror = "2.0"
tl-proto = { version = "0.5", features = ["derive"] }
tl-scheme = { version = "0.3" }
tokio = { version = "1.47", features = ["full", "time"] }
tokio-tower = "0.6"
tokio-util = { version = "0.7", features = ["codec"] }
tower = { version = "0.5", features = ["make", "util"] }
tonutils = { path = "crates/tonutils" }
tonutils-macros = { path = "crates/tonutils-macros" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

absolute_paths = {level = "warn"}
alloc_instead_of_core = "warn"
allow_attributes_without_reason = "warn"
as_underscore = "warn"
assert_is_empty = "warn"
assertions_on_result_states = "warn"
branches_sharing_code = "warn"
cfg_not_test = "warn"
checked_conversions = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
collapsible_else_if = "warn"
collection_is_never_read = "warn"
comparison_chain = "warn"
create_dir = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
decimal_bitwise_operands = "warn"
decimal_literal_representation = "warn"
default_trait_access = "warn"
default_union_representation = "warn"
derive_partial_eq_without_eq = "warn"
disallowed_script_idents = "warn"
doc_broken_link = "warn"
allow_attributes = "warn"

doc_markdown = "allow"
map_unwrap_or = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unreadable_literal = "allow"
similar_names = "allow"
