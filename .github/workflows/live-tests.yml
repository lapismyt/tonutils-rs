name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check workspace feature build
        run: cargo check --workspace --all-features

      - name: Test workspace feature build
        run: cargo test --workspace --all-features

      - name: Lint workspace feature build
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Reject retired full feature commands
        run: |
          if rg -n -- '--features[[:space:]]+full|-F[[:space:]]+full' .github/workflows docs; then
            echo 'The retired full feature must not be used; validate every crate with --workspace --all-features instead.' >&2
            exit 1
          fi

  live-tests:
    name: Live liteserver smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TON_MEMPOOL_ALLOW_LIVE_UNAVAILABLE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Load public TON global config
        run: |
          {
            echo 'TON_GLOBAL_CONFIG_JSON<<TON_GLOBAL_CONFIG_JSON_EOF'
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              https://ton.org/global.config.json
            echo 'TON_GLOBAL_CONFIG_JSON_EOF'
          } >> "$GITHUB_ENV"
          {
            echo 'TON_TESTNET_GLOBAL_CONFIG_JSON<<TON_TESTNET_GLOBAL_CONFIG_JSON_EOF'
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              https://ton.org/testnet-global.config.json
            echo 'TON_TESTNET_GLOBAL_CONFIG_JSON_EOF'
          } >> "$GITHUB_ENV"

      - name: Run live workflow smoke tests
        run: cargo test -p tonutils-liteclient --test live_workflows -- --ignored --nocapture

      - name: Run mempool bootstrap smoke test
        run: cargo test -p tonutils-mempool --test live configured_global_config_can_start_scanner -- --ignored --nocapture

      - name: Run seed-only scanner stream test
        run: cargo test -p tonutils-mempool --test seed_scanner -- --nocapture

      - name: Run mempool mainnet DHT probe
        run: cargo test -p tonutils-mempool --test live mainnet_dht_seed_answers_find_node -- --ignored --nocapture

      - name: Run mempool testnet DHT probe
        run: cargo test -p tonutils-mempool --test live testnet_dht_seed_answers_find_node -- --ignored --nocapture

      - name: Run configured seed-only mempool live test
        env:
          TON_MEMPOOL_LIVE_SEED: ${{ vars.TON_MEMPOOL_LIVE_SEED }}
          TON_MEMPOOL_LIVE_PEER_KEY: ${{ vars.TON_MEMPOOL_LIVE_PEER_KEY }}
          TON_MEMPOOL_LIVE_OVERLAY_ID: ${{ vars.TON_MEMPOOL_LIVE_OVERLAY_ID }}
          TON_MEMPOOL_LIVE_TIMEOUT_SECS: ${{ vars.TON_MEMPOOL_LIVE_TIMEOUT_SECS }}
        run: cargo test -p tonutils-mempool --test live configured_seed_delivers_valid_external_message -- --ignored --nocapture
