name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check workspace feature build
        run: cargo check --workspace --all-features

      - name: Test workspace feature build
        run: cargo test --workspace --all-features

      - name: Lint workspace feature build
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Reject retired full feature commands
        run: |
          if rg -n -- '--features[[:space:]]+full|-F[[:space:]]+full' .github/workflows docs; then
            echo 'The retired full feature must not be used; validate every crate with --workspace --all-features instead.' >&2
            exit 1
          fi

  cross-sdk:
    name: Cross-SDK TL byte comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: scripts/cross_sdk/gen_go/go.mod
          cache-dependency-path: scripts/cross_sdk/gen_go/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned pytoniq-core
        run: python3 -m pip install pytoniq-core==0.2.0

      - name: Verify fixtures against tonutils-go
        working-directory: scripts/cross_sdk/gen_go
        run: go run .

      - name: Verify fixtures against pytoniq-core
        run: python3 scripts/cross_sdk/gen_py.py

      - name: Verify fixtures against tonutils-rs
        run: cargo test -p tonutils --features tl,adnl,overlay,liteclient --lib tl::tests::cross_sdk

  live-tests:
    name: Live DHT, UDP, QUIC, and liteserver gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUST_LOG: tonutils=debug
      TON_LIVE_FEATURES: liteclient,mempool,overlay-config
      TON_LIVE_LOG_DIR: ${{ github.workspace }}/live-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-live-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-live-
            ${{ runner.os }}-cargo-

      - name: Load public TON global config
        run: |
          {
            echo 'TON_GLOBAL_CONFIG_JSON<<TON_GLOBAL_CONFIG_JSON_EOF'
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              https://ton.org/global.config.json
            echo 'TON_GLOBAL_CONFIG_JSON_EOF'
          } >> "$GITHUB_ENV"
          {
            echo 'TON_TESTNET_GLOBAL_CONFIG_JSON<<TON_TESTNET_GLOBAL_CONFIG_JSON_EOF'
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              https://ton.org/testnet-global.config.json
            echo 'TON_TESTNET_GLOBAL_CONFIG_JSON_EOF'
          } >> "$GITHUB_ENV"

      - name: Run mainnet DHT findNode gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh live_probe mainnet_dht_find_node_returns_valid_nodes

      - name: Run testnet DHT findNode gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh live_probe testnet_dht_find_node_returns_valid_nodes

      - name: Run UDP overlay.getRandomPeers gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh live_probe mainnet_udp_overlay_get_random_peers_returns_valid_nodes

      - name: Run QUIC handshake and overlay.getRandomPeers gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh live_probe mainnet_quic_overlay_get_random_peers_returns_valid_nodes

      - name: Run liteserver masterchain info gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh lib liteclient::tests::live_workflows::live_get_masterchain_info_smoke

      - name: Run liteserver version and time gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh lib liteclient::tests::live_workflows::live_get_version_and_time_smoke

      - name: Upload live probe logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-probe-logs
          path: ${{ github.workspace }}/live-logs
          retention-days: 7
          if-no-files-found: warn

  live-delivery:
    name: Live public Plumtree payload gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_LOG: tonutils=debug
      TON_LIVE_FEATURES: mempool,overlay-config
      TON_LIVE_LOG_DIR: ${{ github.workspace }}/live-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-live-delivery-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-live-delivery-
            ${{ runner.os }}-cargo-live-
            ${{ runner.os }}-cargo-

      - name: Load public TON global config
        run: |
          {
            echo 'TON_GLOBAL_CONFIG_JSON<<TON_GLOBAL_CONFIG_JSON_EOF'
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              https://ton.org/global.config.json
            echo 'TON_GLOBAL_CONFIG_JSON_EOF'
          } >> "$GITHUB_ENV"

      - name: Run public Plumtree receive gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh live_delivery mainnet_public_plumtree_receives_payload

      - name: Upload delivery log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-delivery-logs
          path: ${{ github.workspace }}/live-logs
          retention-days: 7
          if-no-files-found: warn
