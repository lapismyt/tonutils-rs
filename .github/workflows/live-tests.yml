name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check workspace feature build
        run: cargo check --workspace --all-features

      - name: Check CLI with its declared features
        run: cargo check -p tonutils-cli

      - name: Test workspace feature build
        run: cargo test --workspace --all-features

      - name: Lint workspace feature build
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Reject retired full feature commands
        run: |
          if rg -n -- '--features[[:space:]]+full|-F[[:space:]]+full' .github/workflows docs; then
            echo 'The retired full feature must not be used; validate every crate with --workspace --all-features instead.' >&2
            exit 1
          fi

  emulator-tests:
    name: Live libemulator gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_LOG: tonutils=debug
      TON_LIVE_FEATURES: emulator-download
      TON_LIVE_LOG_DIR: ${{ github.workspace }}/emulator-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-emulator-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-emulator-
            ${{ runner.os }}-cargo-

      - name: Run libemulator version gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh lib emulator::tests::live_engine_reports_version_and_accepts_verbosity

      - name: Run wallet seqno get-method gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh lib emulator::tests::live_wallet_v4r2_seqno_get_method

      - name: Run wallet public-key get-method gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh lib emulator::tests::live_wallet_v4r2_public_key_get_method

      - name: Run wallet internal-message gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh lib emulator::tests::live_wallet_v4r2_internal_message_is_accepted

      - name: Upload emulator logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: emulator-logs
          path: ${{ github.workspace }}/emulator-logs
          retention-days: 7
          if-no-files-found: warn

  provider-tests:
    name: Live mainnet HTTP provider gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_LOG: tonutils=debug
      TON_LIVE_FEATURES: provider
      TON_LIVE_LOG_DIR: ${{ github.workspace }}/provider-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-provider-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-provider-
            ${{ runner.os }}-cargo-

      - name: Run Toncenter v2 masterchain info gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh provider_live toncenter_v2_live_masterchain_info

      - name: Run Toncenter v2 account state and get-method gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh provider_live toncenter_v2_live_account_state_and_get_method

      - name: Run Toncenter v2 transactions gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh provider_live toncenter_v2_live_transactions

      - name: Run Toncenter v3 masterchain info gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh provider_live toncenter_v3_live_masterchain_info

      - name: Run Toncenter v3 account state and get-method gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh provider_live toncenter_v3_live_account_state_and_get_method

      - name: Run Toncenter v3 transactions gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh provider_live toncenter_v3_live_transactions

      - name: Run TonAPI masterchain info gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh provider_live tonapi_live_masterchain_info

      - name: Run TonAPI account state and get-method gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh provider_live tonapi_live_account_state_and_get_method

      - name: Run TonAPI transactions gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh provider_live tonapi_live_transactions

      - name: Upload provider logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: provider-logs
          path: ${{ github.workspace }}/provider-logs
          retention-days: 7
          if-no-files-found: warn

  live-tests:
    name: Live mainnet DHT and liteserver gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUST_LOG: tonutils=debug
      TON_LIVE_FEATURES: liteclient
      TON_LIVE_LOG_DIR: ${{ github.workspace }}/live-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-live-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-live-
            ${{ runner.os }}-cargo-

      - name: Load public TON global config
        run: |
          {
            echo 'TON_GLOBAL_CONFIG_JSON<<TON_GLOBAL_CONFIG_JSON_EOF'
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              https://ton.org/global.config.json
            echo 'TON_GLOBAL_CONFIG_JSON_EOF'
          } >> "$GITHUB_ENV"
          {
            echo 'TON_TESTNET_GLOBAL_CONFIG_JSON<<TON_TESTNET_GLOBAL_CONFIG_JSON_EOF'
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              https://ton.org/testnet-global.config.json
            echo 'TON_TESTNET_GLOBAL_CONFIG_JSON_EOF'
          } >> "$GITHUB_ENV"

      - name: Run mainnet DHT findNode gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh live_probe mainnet_dht_find_node_returns_valid_nodes

      - name: Run liteserver masterchain info gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh lib liteclient::tests::live_workflows::live_get_masterchain_info_smoke

      - name: Run liteserver version and time gate
        if: ${{ !cancelled() }}
        run: ./scripts/run-live-test.sh lib liteclient::tests::live_workflows::live_get_version_and_time_smoke

      - name: Run testnet liteserver masterchain info gate
        if: ${{ !cancelled() }}
        run: TON_GLOBAL_CONFIG_JSON="$TON_TESTNET_GLOBAL_CONFIG_JSON" ./scripts/run-live-test.sh lib liteclient::tests::live_workflows::live_testnet_liteserver_smoke

      - name: Upload live probe logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-probe-logs
          path: ${{ github.workspace }}/live-logs
          retention-days: 7
          if-no-files-found: warn
