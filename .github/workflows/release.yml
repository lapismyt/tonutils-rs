name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  crates-io:
    name: Publish crates.io packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Validate release tag and workspace version
        shell: bash
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "CRATES_IO_TOKEN repository secret is required."
            exit 1
          fi

          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tonutils-crc") | .version')"
          expected_tag="v${version}"
          release_tag="${{ github.event.release.tag_name }}"

          if [[ "$release_tag" != "$expected_tag" ]]; then
            echo "Release tag $release_tag does not match workspace version $version."
            exit 1
          fi

      - name: Verify workspace packages
        run: |
          cargo fmt --check
          cargo check --workspace --all-features
          cargo test --workspace --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          for package in tonutils-crc tonutils-tl tonutils-macros tonutils-tvm tonutils-tlb tonutils-adnl tonutils-network-config tonutils-metadata tonutils-contracts tonutils-liteclient tonutils-jetton tonutils-nft tonutils-wallet tonutils-cli; do
            cargo package -p "$package"
          done

      - name: Publish workspace packages
        shell: bash
        run: |
          for package in tonutils-crc tonutils-tl tonutils-macros tonutils-tvm tonutils-tlb tonutils-adnl tonutils-network-config tonutils-metadata tonutils-contracts tonutils-liteclient tonutils-jetton tonutils-nft tonutils-wallet tonutils-cli; do
            cargo publish -p "$package"
          done
