minimum_prek_version = "0.5.0"

[priorities]
format = 0
checks = 10
supply-chain = 20

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", priority = "format" },
  { id = "end-of-file-fixer", priority = "format", exclude = "^crates/tonutils/src/tlb/schemas/.*\\.tlb$" },
  { id = "mixed-line-ending", args = ["--fix=lf"], priority = "format" },
  { id = "check-merge-conflict", priority = "checks" },
  { id = "check-case-conflict", priority = "checks" },
  { id = "check-added-large-files", args = ["--maxkb=1024"], priority = "checks" },
  { id = "check-toml", priority = "checks" },
  { id = "check-yaml", priority = "checks" },
  { id = "check-json", priority = "checks" },
  { id = "detect-private-key", priority = "checks" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    language = "system",
    entry = "just fmt",
    files = "\\.rs$",
    pass_filenames = false,
    priority = "format",
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    language = "system",
    entry = "just check",
    files = "(^|/)Cargo\\.(toml|lock)$|\\.rs$",
    pass_filenames = false,
    priority = "checks",
  },
  {
    id = "cargo-deny",
    name = "cargo deny",
    language = "system",
    entry = "just deny",
    files = "(^|/)Cargo\\.(toml|lock)$|^deny\\.toml$",
    pass_filenames = false,
    priority = "supply-chain",
  },
]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-hooks-apply", priority = "checks" },
  { id = "check-useless-excludes", priority = "checks" },
]
